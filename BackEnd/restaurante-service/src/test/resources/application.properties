spring.application.name=restaurante-service
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:restaurante;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=clave-exclusiva-de-pruebas-no-utilizar-en-produccion-1234567890
seguridad.internal-key=clave-interna-de-pruebas
restaurante.horario.apertura=08:00
restaurante.horario.cierre=22:00
archivos.proveedor=local

spring.config.import=
spring.datasource.driver-class-name=org.h2.Driver
