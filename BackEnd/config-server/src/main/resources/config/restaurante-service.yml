server:
  port: 8091
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/db_restaurante?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 15000
restaurante:
  horario:
    apertura: ${RESTAURANTE_HORARIO_APERTURA:08:00}
    cierre: ${RESTAURANTE_HORARIO_CIERRE:22:00}
archivos:
  proveedor: ${ARCHIVOS_PROVEEDOR:local}
drive:
  credenciales: ${DRIVE_CREDENCIALES:privado/google-drive.json}
  carpeta:
    comandas: ${DRIVE_CARPETA_COMANDAS:1M5pbP76eqBPmhfS2l6Ukb9P7qc2YmuyB}
    restaurantes: ${DRIVE_CARPETA_RESTAURANTES:}
    productos: ${DRIVE_CARPETA_PRODUCTOS:}
comandas:
  directorio: ${COMANDAS_DIRECTORIO:uploads/comandas}
restaurantes:
  fotos:
    directorio: ${RESTAURANTE_FOTOS_DIRECTORIO:uploads/restaurantes}
productos:
  fotos:
    directorio: ${PRODUCTOS_FOTOS_DIRECTORIO:uploads/productos}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
