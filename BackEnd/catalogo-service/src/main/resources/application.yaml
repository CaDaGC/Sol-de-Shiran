server:
  port: 8086

spring:
  application:
    name: catalogo-service

  config:
    import: "optional:configserver:http://localhost:8089/"

  datasource:
    url: jdbc:mysql://localhost:3307/db_catalogo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: root
    password: mysql123

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
