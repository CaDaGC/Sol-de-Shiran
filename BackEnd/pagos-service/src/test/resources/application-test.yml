spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:pagos;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

mercadopago:
  access-token: test-access-token
  webhook-secret: test-webhook-secret
  webhook-url: https://example.test/api/v1/pagos/webhook

servicios:
  interno:
    token: test-internal-token
