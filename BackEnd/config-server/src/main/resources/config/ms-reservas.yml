server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/db_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

reservas:
  tiempo-expiracion-minutos: 15
  limpieza-cada-ms: 60000

servicios:
  interno:
    token: ${INTERNAL_SERVICE_TOKEN:sol-de-shiran-local-internal-token-change-me}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}