server:
  address: 127.0.0.1
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: security-microservice
              uri: lb://security-microservice
              predicates:
                - Path=/api/**
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
