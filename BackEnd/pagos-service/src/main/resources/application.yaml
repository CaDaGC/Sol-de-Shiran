server:
  port: 18083

spring:
  application:
    name: ms-pagos
  config:
    import: "optional:configserver:http://localhost:18089/"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:18762/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}