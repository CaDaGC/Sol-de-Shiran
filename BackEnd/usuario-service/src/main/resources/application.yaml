server:
  port: 18087

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: usuario-service

  config:
    import: "optional:configserver:http://localhost:18089/"

  datasource:
      url: jdbc:mysql://localhost:3307/usuario_db
      username: root
      password: mysql123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:18762/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
