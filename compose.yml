name: sol-de-shiran

x-java: &java
  restart: unless-stopped
  init: true
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness >/dev/null || exit 1"]
    interval: 5s
    timeout: 5s
    start_period: 30s
    retries: 48
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-discovery: &discovery
  TZ: America/Lima
  JAVA_TOOL_OPTIONS: "-Xms64m -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2 -Djava.awt.headless=true"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
  EUREKA_CLIENT_INITIAL_INSTANCE_INFO_REPLICATION_INTERVAL_SECONDS: "5"
  EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
  EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "15"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

x-domain: &domain
  <<: *discovery
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8089/
  CONFIG_SERVER_URL: http://config-server:8089/
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
  JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
  INTERNAL_KEY: ${INTERNAL_KEY:?Configura INTERNAL_KEY en .env}
  SEGURIDAD_INTERNAL_KEY: ${INTERNAL_KEY}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configura INTERNAL_SERVICE_TOKEN en .env}
  SERVICIOS_INTERNO_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  USUARIOS_URL: http://usuario-service:8087
  CATALOGO_URL: http://catalogo-service:8086

x-archivos: &archivos
  ARCHIVOS_PROVEEDOR: ${ARCHIVOS_PROVEEDOR:-local}
  DRIVE_CREDENCIALES: ${DRIVE_CREDENCIALES:-/run/privado/google-drive.json}
  DRIVE_CARPETA_PERFILES: ${DRIVE_CARPETA_PERFILES:-1DJowW2-fEZ5gdKanuj4P9KufWwRQIO7_}
  DRIVE_CARPETA_CABANAS: ${DRIVE_CARPETA_CABANAS:-13KmUpK4yKJ0NMMjTOCJdyL4SQwcEs8XR}
  DRIVE_CARPETA_COMPROBANTES: ${DRIVE_CARPETA_COMPROBANTES:-1bS3PGBQ635RVoXGkplo8ZfP_FKNeErFj}
  ARCHIVOS_MIGRAR: ${ARCHIVOS_MIGRAR:-false}

x-database: &database
  <<: *domain
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Configura DB_USERNAME en .env}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      TZ: America/Lima
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MYSQL_ROOT_HOST: "%"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u root --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 60
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  service-registry:
    <<: *java
    depends_on:
      mysql:
        condition: service_healthy
    image: sol-de-shiran/service-registry:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: service-registry
    ports:
      - "127.0.0.1:8762:8762"
    environment:
      <<: *discovery
      SERVER_PORT: "8762"
      EUREKA_INSTANCE_HOSTNAME: service-registry
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_SERVER_USE_READ_ONLY_RESPONSE_CACHE: "false"

  config-server:
    <<: *java
    image: sol-de-shiran/config-server:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: config-server
    ports:
      - "127.0.0.1:8089:8089"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      <<: *discovery
      SERVER_PORT: "8089"
      SPRING_PROFILES_ACTIVE: native

  usuario-service:
    <<: *java
    image: sol-de-shiran/usuario-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: usuario-service
    ports:
      - "127.0.0.1:8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      <<: [*database, *archivos]
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/usuario_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USUARIOS_FOTOS_DIRECTORIO: /app/uploads/perfiles
    volumes:
      - ./uploads/perfiles:/app/uploads/perfiles
      - ./privado:/run/privado:ro

  auth-service:
    <<: *java
    image: sol-de-shiran/auth-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: auth-service
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      usuario-service:
        condition: service_healthy
    environment:
      <<: *domain
      SERVER_PORT: "8088"

  catalogo-service:
    <<: *java
    image: sol-de-shiran/catalogo-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: catalogo-service
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      <<: [*database, *archivos]
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_catalogo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      CATALOGO_FOTOS_DIRECTORIO: /app/uploads/cabanas
    volumes:
      - ./uploads/cabanas:/app/uploads/cabanas
      - ./privado:/run/privado:ro

  reservas-service:
    <<: *java
    image: sol-de-shiran/reservas-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: reservas-service
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      catalogo-service:
        condition: service_healthy
    environment:
      <<: [*database, *archivos]
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  pagos-service:
    <<: *java
    image: sol-de-shiran/pagos-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: pagos-service
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      reservas-service:
        condition: service_healthy
    environment:
      <<: [*database, *archivos]
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_pagos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      MP_FRONTEND_URL: http://localhost:4200
      COMPROBANTES_DIRECTORIO: /app/uploads/comprobantes
    volumes:
      - ./uploads/comprobantes:/app/uploads/comprobantes
      - ./privado:/run/privado:ro

  resenas-service:
    <<: *java
    image: sol-de-shiran/resenas-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: resenas-service
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
    environment:
      <<: [*database, *archivos]
      SERVER_PORT: "8090"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_resenas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"

  api-gateway:
    <<: *java
    image: sol-de-shiran/api-gateway:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: api-gateway
    ports:
      - "127.0.0.1:8061:8061"
    depends_on:
      resenas-service:
        condition: service_healthy
    environment:
      <<: *domain
      SERVER_PORT: "8061"

  frontend:
    image: sol-de-shiran/frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 256m
    ports:
      - "127.0.0.1:4200:4000"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      TZ: America/Lima
      NODE_ENV: production
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
      PORT: "4000"

volumes:
  mysql-data:
